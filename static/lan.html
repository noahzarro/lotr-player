<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Movie player</title><link rel=stylesheet href="/static/theme.css">
<div class=wrap>
<h1>Movie player</h1>
<div class=card><h2>Now playing</h2><div class=now id=status>...</div><div class=muted id=sub></div><input type=range id=seek min=0 max=1000 value=0 step=1 disabled></div>
<div class=card id=pair hidden>
  <h2>Pair this device</h2>
  <input id=code placeholder="One-time code">
  <input id=name placeholder="Your name">
  <button class=primary id=go>Pair</button> <span id=err></span>
</div>
<div id=ctl hidden>
  <div class=card>
    <p class=muted style="margin-top:0">Hello <b id=me></b></p>
    <div class=row><button class=primary onclick="post('resume')">Resume</button><button onclick="post('pause')">Pause</button><button onclick="post('stop')">Stop</button></div>
    <div class=row><button onclick="rel(-30)">-30s</button><button onclick="rel(30)">+30s</button></div>
  </div>
  <div class=card><h2>Movies</h2><ul id=movies></ul></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let last=null,dragging=false,authed=false;
const fmt=s=>{s=Math.floor(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
async function post(a,body){
  const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(r.status==401)showPair();
}
function rel(d){if(last&&last.position_s!=null)post('seek',{seconds:last.position_s+d})}
function showPair(){authed=false;$('pair').hidden=false;$('ctl').hidden=true}
async function status(){
  try{
    last=await (await fetch('/api/status')).json();
    $('status').textContent=last.movie||'Nothing playing';
    $('sub').textContent=last.movie?`${last.state} · ${fmt(last.position_s||0)} / ${last.length_s?fmt(last.length_s):'?'}`:'';
    const can=authed&&last.movie&&last.length_s;
    $('seek').disabled=!can;
    if(!dragging)$('seek').value=can?1000*last.position_s/last.length_s:0;
  }catch(e){}
}
async function init(){
  const code=new URLSearchParams(location.search).get('code');
  if(code)$('code').value=code;
  const r=await fetch('/api/me');
  if(!r.ok){showPair();return}
  $('me').textContent=(await r.json()).name;
  authed=true;$('pair').hidden=true;$('ctl').hidden=false;
  const m=await (await fetch('/api/movies')).json();
  $('movies').innerHTML='';
  m.forEach(f=>{const li=document.createElement('li'),b=document.createElement('button');
    b.className='movie';
    if(f.has_image){const i=document.createElement('img');i.src='/api/movies/image?name='+encodeURIComponent(f.name);i.loading='lazy';b.append(i)}
    const t=document.createElement('span');t.textContent=f.name;b.append(t);
    b.onclick=()=>post('play',{name:f.name});li.append(b);$('movies').append(li)});
  if(!m.length)$('movies').innerHTML='<li class=muted>No movies found</li>';
}
const sk=$('seek');
sk.addEventListener('input',()=>{dragging=true;
  if(last&&last.length_s)$('sub').textContent=`seek to ${fmt(sk.value/1000*last.length_s)} / ${fmt(last.length_s)}`});
sk.addEventListener('change',async()=>{
  if(last&&last.length_s)await post('seek',{seconds:sk.value/1000*last.length_s});
  dragging=false;
});
$('go').onclick=async()=>{
  const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:$('code').value.trim(),name:$('name').value})});
  if(r.ok){history.replaceState({},'','/');init()}
  else $('err').textContent=(await r.json()).detail||'failed';
};
init();status();setInterval(status,1000);
</script>
