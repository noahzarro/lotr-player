<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Movie player</title>
<style>body{font-family:sans-serif;max-width:600px;margin:1em auto;padding:0 1em}
button,input{font-size:1.1em;padding:.5em;margin:.2em}li{margin:.4em 0}</style>
<h1>Movie player</h1>
<div id=status>...</div>
<div id=pair hidden>
  <h2>Pair this device</h2>
  <input id=code placeholder="one-time code"><br>
  <input id=name placeholder="your name"><br>
  <button id=go>Pair</button> <span id=err style="color:red"></span>
</div>
<div id=ctl hidden>
  <p>Hello <b id=me></b></p>
  <button onclick="post('resume')">Resume</button>
  <button onclick="post('pause')">Pause</button>
  <button onclick="post('stop')">Stop</button><br>
  <button onclick="rel(-30)">-30s</button><button onclick="rel(30)">+30s</button>
  <h2>Movies</h2><ul id=movies></ul>
</div>
<script>
const $=id=>document.getElementById(id);
let last=null;
const fmt=s=>{s=Math.floor(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
async function post(a,body){
  const r=await fetch('/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(r.status==401)showPair();
}
function rel(d){if(last&&last.position_s!=null)post('seek',{seconds:last.position_s+d})}
function showPair(){$('pair').hidden=false;$('ctl').hidden=true}
async function status(){
  try{
    last=await (await fetch('/api/status')).json();
    $('status').textContent=last.movie?`${last.movie} [${last.state}] ${fmt(last.position_s||0)} / ${last.length_s?fmt(last.length_s):'?'}`:'Nothing playing';
  }catch(e){}
}
async function init(){
  const code=new URLSearchParams(location.search).get('code');
  if(code)$('code').value=code;
  const r=await fetch('/api/me');
  if(!r.ok){showPair();return}
  $('me').textContent=(await r.json()).name;
  $('pair').hidden=true;$('ctl').hidden=false;
  const m=await (await fetch('/api/movies')).json();
  $('movies').innerHTML='';
  m.forEach(f=>{const li=document.createElement('li'),b=document.createElement('button');
    b.textContent='▶ '+f;b.onclick=()=>post('play',{filename:f});li.append(b);$('movies').append(li)});
  if(!m.length)$('movies').textContent='No movies found';
}
$('go').onclick=async()=>{
  const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:$('code').value.trim(),name:$('name').value})});
  if(r.ok){history.replaceState({},'','/');init()}
  else $('err').textContent=(await r.json()).detail||'failed';
};
init();status();setInterval(status,1000);
</script>
